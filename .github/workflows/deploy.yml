name: Deploy Shopline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-pages:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build for Cloudflare Pages
        working-directory: frontend
        run: npm run pages:build
        env:
          NEXT_PUBLIC_API_URL: https://shopline-backend.arvix1413.workers.dev

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy .vercel/output/static --project-name shopline-frontend --branch ${{ github.ref_name }}

  deploy-worker:
    name: Deploy Cloudflare Worker API
    runs-on: ubuntu-latest
    needs: deploy-pages

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: deploy

  notify:
    name: Notify Telegram
    runs-on: ubuntu-latest
    needs: [deploy-pages, deploy-worker]
    if: always() && !cancelled()

    steps:
      - uses: actions/checkout@v4

      - name: Notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGES_STATUS: ${{ needs.deploy-pages.result }}
          WORKER_STATUS: ${{ needs.deploy-worker.result }}
          REPO: ${{ github.repository }}
          PROJECT_NAME: shopline-v2
          BRANCH: ${{ github.ref_name }}
          SITE_URL: https://shopline-frontend.pages.dev
          API_URL: https://shopline-backend.arvix1413.workers.dev
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram notification skipped: missing bot token or chat id"
            exit 0
          fi

          if [ "${PAGES_STATUS}" = "success" ] && [ "${WORKER_STATUS}" = "success" ]; then
            STATUS_TEXT="部署成功"
          else
            STATUS_TEXT="部署失败"
          fi

          COMMIT_MESSAGE=$(git log -1 --pretty=%B | sed '/^[[:space:]]*$/d')

          MESSAGE=$(cat <<EOF
          [部署通知]

          项目:
          ${PROJECT_NAME}

          仓库:
          ${REPO}

          分支:
          ${BRANCH}

          站点:
          ${SITE_URL}

          API:
          ${API_URL}

          Pages:
          ${PAGES_STATUS}

          Worker:
          ${WORKER_STATUS}

          部署结果:
          ${STATUS_TEXT}

          提交内容:
          ${COMMIT_MESSAGE}

          运行详情:
          ${RUN_URL}
          EOF
          )

          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"
